[project]
name = "versatile_mall_multi_tenan_api"
version = "0.2.0"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.2.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "redis[asyncio]>=5.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "greenlet>=3.0.0",
    "alembic>=1.12.0",
    "passlib[bcrypt]>=1.7.4",
    "loguru>=0.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.26.0"
]

[tool.setuptools.packages.find]
where = ["src"]